<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0}
  *{box-sizing:border-box}
</style>
</helmet>

<div style="min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 20px;background:#E7E5DF;font-family:'Plus Jakarta Sans',system-ui,sans-serif">

  <div style="text-align:center">
    <div style="font-size:11px;font-weight:800;letter-spacing:.14em;color:#9A968C">BAHAWATCH</div>
    <div style="font-size:22px;font-weight:800;letter-spacing:-.02em;color:#1c1c1a;margin-top:3px">Mobile preview — live &amp; interactive</div>
    <div style="font-size:13px;color:#6B6B63;margin-top:4px">Tap <b>Report flood</b>, drop a pin, and watch your safety status update.</div>
  </div>

  <!-- DEVICE -->
  <div style="position:relative;width:414px;height:846px;max-height:88vh;background:#0B0B0C;border-radius:56px;padding:13px;box-shadow:0 40px 80px rgba(15,23,42,.4),0 0 0 2px #2a2a2c inset;flex:none">
    <!-- side buttons -->
    <div style="position:absolute;left:-3px;top:150px;width:3px;height:34px;background:#2a2a2c;border-radius:3px 0 0 3px"></div>
    <div style="position:absolute;left:-3px;top:200px;width:3px;height:54px;background:#2a2a2c;border-radius:3px 0 0 3px"></div>
    <div style="position:absolute;left:-3px;top:268px;width:3px;height:54px;background:#2a2a2c;border-radius:3px 0 0 3px"></div>
    <div style="position:absolute;right:-3px;top:215px;width:3px;height:74px;background:#2a2a2c;border-radius:0 3px 3px 0"></div>

    <!-- screen -->
    <div style="position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#fff">
      <!-- dynamic island -->
      <div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:108px;height:30px;background:#000;border-radius:18px;z-index:10;pointer-events:none"></div>
      <iframe src="BahaWatch.dc.html" title="BahaWatch mobile" style="width:100%;height:100%;border:0;display:block"></iframe>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
