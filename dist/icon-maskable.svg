<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
  <!-- Maskable variant: gradient bleeds to all edges so any launcher mask (circle, squircle,
       rounded square) still shows brand color. The rain/flood motif is scaled into the central
       safe zone (~66%) so the mask never clips it. -->
  <defs>
    <linearGradient id="gm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" fill="url(#gm)"/>
  <g transform="translate(24 24) scale(0.6) translate(-24 -24)">
    <g stroke="#fff" stroke-width="2.6" stroke-linecap="round">
      <line x1="16" y1="11" x2="13" y2="18"/>
      <line x1="24" y1="9"  x2="21" y2="16"/>
      <line x1="32" y1="11" x2="29" y2="18"/>
    </g>
    <path d="M-2 30 q 7 -6 14 0 t 14 0 t 14 0 t 14 0 V50 H-2 Z" fill="#fff" opacity="0.5"/>
    <path d="M-2 35 q 7 -6 14 0 t 14 0 t 14 0 t 14 0 V50 H-2 Z" fill="#fff"/>
  </g>
</svg>
